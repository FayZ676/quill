# Quill for iPhone and iPad. Generate the Xcode project with `xcodegen` (iOS/build.sh does).
name: Quill
options:
  bundleIdPrefix: com.faizififita
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: WG5M4FAV79
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: ${VERSION}
    CURRENT_PROJECT_VERSION: ${VERSION}
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Quill:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Sources/Quill/Shared
        group: Shared
      - path: ../Resources/Fonts
        type: folder
      - path: ../Resources/Assets.xcassets
      - path: build/Icon.xcassets
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faizififita.quill
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Quill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        # Shows the library in the Files app, under On My iPhone › Quill.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHumanReadableCopyright: iA Writer fonts © Information Architects Inc., SIL Open Font License.
